name: frontend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install yarn
        run: npm install -g yarn@1.22.22
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn biome ci .
      - name: Typecheck
        run: yarn tsc --noEmit
      - name: Unit test
        run: yarn vitest run
      - name: Build
        run: yarn build
